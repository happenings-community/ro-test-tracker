name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths: ['worker/**', 'public/**', 'wrangler.jsonc', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing to build: the page and templates are served as they are.
      - name: Tests
        run: node --test --test-concurrency=1 test/api.test.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.0"
          command: deploy
